<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Teclas</title>
    <link rel="stylesheet" href="detector.css">
</head>
<body>
  <div class="container">
    <h1>Mostrador de Teclas</h1>
    <div class="cards-grid">
      <div class="card">
        <p class="label">event.key</p>
        <div id="key" class="value">-</div>
      </div>
      <div class="card">
        <p class="label">event.code</p>
        <div id="code" class="value">-</div>
      </div>
      <div class="card">
        <p class="label">event.keyCode</p>
        <div id="keyCode" class="value">-</div>
      </div>
    </div>
  </div>
<script src="detector.js"></script>
</body>
</html>
